<!--
  ===== Анкета «День рождения под ключ» =====
  Вставьте блок целиком (от <section id="bd"> до </section>) на страницу сайта или откройте файл отдельно.
  Куда отправлять анкету, контакты и ссылка на политику: блок CONFIG в самом конце, в скрипте.
  Вопросы и главы правятся в массиве CH там же.
-->
<section id="bd" aria-labelledby="bd-t">
<style>
#bd{--ink:#26305E;--soft:#4B5686;--moon:#FFC94A;--moon2:#E69F00;--mist:#EEF1FF;--line:#C5CEEE;--ok:#1F8A62;--bad:#B8334A;
  font-family:"Nunito","Trebuchet MS","Segoe UI",system-ui,sans-serif;color:var(--ink);line-height:1.55;max-width:760px;margin:0 auto;padding:16px;text-align:left}
#bd *,#bd *::before,#bd *::after{box-sizing:border-box}
#bd .bd-card{background:#fff;border:2px solid var(--line);border-radius:22px;overflow:hidden}
#bd .bd-sky{background:var(--ink);color:#fff;padding:24px 24px 20px}
#bd .bd-sky h2{font-family:Georgia,"Times New Roman",serif;font-size:clamp(25px,5.5vw,34px);line-height:1.2;margin:0 0 8px;color:#fff}
#bd .bd-sky p{margin:0;color:#DCE1FF}
#bd .bd-stars{display:flex;gap:10px;margin:18px 0 8px;padding:0;list-style:none}
#bd .bd-star svg{display:block;width:30px;height:30px;fill:none;stroke:#8E99D6;stroke-width:1.6;stroke-linejoin:round;transition:fill .35s,stroke .35s,transform .35s}
#bd .bd-star.done svg{fill:var(--moon);stroke:var(--moon)}
#bd .bd-star.now svg{fill:var(--moon);stroke:#fff;transform:scale(1.22)}
#bd .bd-step{font-weight:700;color:#fff!important}
#bd .bd-body{padding:24px}
#bd .bd-ch[hidden]{display:none}
#bd h3{font-family:Georgia,"Times New Roman",serif;font-size:clamp(22px,4.5vw,27px);margin:0 0 6px;outline:none}
#bd .bd-lead{margin:0 0 22px;color:var(--soft)}
#bd .bd-field{margin:0 0 18px}
#bd .bd-label{display:block;font-weight:700;margin:0 0 6px}
#bd .bd-opt{font-weight:400;color:var(--soft)}
#bd .bd-hint{display:block;margin:0 0 6px;font-size:14px;color:var(--soft)}
#bd .bd-err{display:block;margin-top:6px;font-size:14px;font-weight:700;color:var(--bad)}
#bd .bd-err:empty{display:none}
#bd input[type=text],#bd input[type=date],#bd select,#bd textarea{display:block;width:100%;font:inherit;font-size:16px;color:var(--ink);background:#fff;border:2px solid var(--line);border-radius:12px;padding:11px 14px;min-height:48px}
#bd textarea{resize:vertical;min-height:92px}
#bd [aria-invalid=true]{border-color:var(--bad)}
#bd :focus-visible{outline:3px solid var(--moon2);outline-offset:2px}
#bd .bd-chips{display:flex;flex-wrap:wrap;gap:8px}
#bd .bd-chips label{position:relative;display:inline-block}
#bd .bd-chips input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
#bd .bd-chips span{display:inline-block;padding:9px 15px;border:2px solid var(--line);border-radius:999px;background:#fff;font-size:15px}
#bd .bd-chips input:checked+span{background:var(--moon);border-color:var(--moon2);font-weight:700}
#bd .bd-chips input:checked+span::before{content:"✓ "}
#bd .bd-chips input:focus-visible+span{outline:3px solid var(--ink);outline-offset:2px}
#bd .bd-consent{display:flex;gap:12px;align-items:flex-start;font-size:15px}
#bd .bd-consent input{width:24px;height:24px;margin:2px 0 0;flex:none;accent-color:var(--ink)}
#bd .bd-consent a{color:var(--ink);font-weight:700}
#bd .bd-nav{display:flex;justify-content:space-between;gap:12px;margin-top:26px;flex-wrap:wrap}
#bd .bd-btn{font:inherit;font-weight:800;font-size:16px;min-height:48px;padding:12px 26px;border-radius:999px;border:2px solid var(--ink);background:var(--moon);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
#bd .bd-btn:hover{background:#FFD978}
#bd .bd-btn.ghost{background:#fff}
#bd .bd-btn[disabled]{opacity:.6;cursor:wait}
#bd .bd-done textarea{min-height:200px;font-size:14px}
#bd .bd-actions{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}
#bd .bd-ok{color:var(--ok);font-weight:700}
@media (prefers-reduced-motion:reduce){#bd *{transition:none!important}}
</style>
<noscript>Для заполнения анкеты нужен включённый JavaScript. Или напишите нам, и мы пришлём анкету сообщением.</noscript>

<div class="bd-card">
  <div class="bd-sky">
    <h2 id="bd-t">День рождения под ключ</h2>
    <p>Расскажите о празднике, и мы соберём комплект: сценарий, меню, чек-лист и квест. Заполнение занимает около 10 минут.</p>
    <ol class="bd-stars" id="bd-stars" aria-hidden="true"></ol>
    <p class="bd-step" id="bd-step" aria-live="polite"></p>
  </div>
  <div class="bd-body">
    <form id="bd-form" novalidate>
      <div id="bd-ch"></div>
      <div class="bd-nav">
        <button type="button" class="bd-btn ghost" id="bd-back">Назад</button>
        <button type="button" class="bd-btn" id="bd-next">Дальше</button>
        <button type="submit" class="bd-btn" id="bd-send" hidden>Отправить анкету</button>
      </div>
      <p class="bd-err" id="bd-senderr" role="alert"></p>
    </form>
    <div class="bd-done" id="bd-done" hidden></div>
  </div>
</div>

<script>
(function () {
  "use strict";

  /* ===== НАСТРОЙКИ ===== */
  var CONFIG = {
    submitUrl: "",            // адрес приёма (POST, multipart/form-data: поля summary, answers). Пусто = запасной вариант с копированием
    telegram: "Alex_delo",    // запасной канал, в России Telegram работает с ограничениями
    max: "",                  // ссылка на ваш Max, например "https://max.ru/..."
    email: "al-vakarin@yandex.ru",
    privacyUrl: "#"
  };

  /* ===== ВОПРОСЫ: t = тип (text, textarea, date, select, chips, consent), r = обязательно ===== */
  var CH = [
    { t: "Именинник и праздник", lead: "Начнём с главного: кому и когда праздник.", f: [
      { n: "child_name", l: "Как зовут именинника", t: "text", r: 1, m: "Напишите имя" },
      { n: "age", l: "Сколько ему или ей исполняется", t: "text", r: 1, m: "Напишите возраст" },
      { n: "date", l: "Дата праздника", t: "date" },
      { n: "parent_name", l: "Ваше имя", t: "text", r: 1, m: "Напишите, как к вам обращаться" },
      { n: "contact", l: "Как с вами связаться", t: "text", r: 1, m: "Оставьте телефон, почту или Max" }
    ]},
    { t: "Гости и место", lead: "Это нужно, чтобы сценарий и квест подошли именно вашему празднику.", f: [
      { n: "kids", l: "Сколько детей-гостей", t: "text" },
      { n: "ages", l: "Возраст гостей", t: "text", p: "Например, 5–8 лет" },
      { n: "adults", l: "Сколько взрослых будет рядом", t: "text" },
      { n: "place", l: "Где пройдёт праздник", t: "select", r: 1, m: "Выберите место",
        o: ["Дома", "Во дворе или на даче", "В посёлке, на общей территории", "В кафе или детском центре", "На природе", "Пока не решили"] },
      { n: "place_desc", l: "Опишите место", t: "textarea", h: "Что там есть: комната, беседка, площадка, магазин рядом. Чем подробнее, тем лучше получится квест." },
      { n: "duration", l: "Сколько длится праздник", t: "select", o: ["1 час", "2 часа", "3 часа", "Пока не решили"] },
      { n: "plan_b", l: "Нужен запасной вариант на плохую погоду", t: "select", o: ["Да", "Нет"] }
    ]},
    { t: "Интересы и тема", lead: "Тема превращает набор заданий в историю, которую запомнят.", f: [
      { n: "themes", l: "Какие темы нравятся имениннику", t: "chips",
        o: ["Динозавры", "Космос", "Пираты", "Супергерои", "Принцессы и феи", "Животные", "Магия", "Машины", "Футбол", "Рыцари", "Подводный мир", "Сладкая страна"] },
      { n: "heroes", l: "Любимые герои, мультики, игры", t: "textarea" },
      { n: "hobbies", l: "Чем увлекается именинник", t: "textarea" },
      { n: "avoid", l: "Чего на празднике быть не должно", t: "textarea", h: "Например, страшные сцены, громкие хлопушки, соревнования на скорость." },
      { n: "food", l: "Пищевые ограничения гостей", t: "textarea", h: "Только то, что нужно для меню: аллергии, вегетарианство. Подробности о здоровье не нужны." }
    ]},
    { t: "Что нужно в комплекте", lead: "Отметьте, что вам пригодится. Остальное мы не будем делать.", f: [
      { n: "kit", l: "Что включить в комплект", t: "chips",
        o: ["Приглашения", "Сценарий по часам", "Меню и список покупок", "Чек-лист подготовки", "Квест для гостей", "Дипломы и призы", "Идеи декора"] },
      { n: "budget", l: "Бюджет на сам праздник", t: "select", o: ["до 3 000 ₽", "3 000–7 000 ₽", "7 000–15 000 ₽", "больше", "Пока не знаю"] },
      { n: "wishes", l: "Что ещё важно рассказать", t: "textarea" },
      { n: "consent", t: "consent", r: 1, m: "Чтобы отправить анкету, поставьте отметку согласия" }
    ]}
  ];
  /* ================================ */

  var root = document.getElementById("bd");
  var form = root.querySelector("#bd-form"), holder = root.querySelector("#bd-ch");
  var starsEl = root.querySelector("#bd-stars"), stepEl = root.querySelector("#bd-step");
  var back = root.querySelector("#bd-back"), nextB = root.querySelector("#bd-next"), send = root.querySelector("#bd-send");
  var senderr = root.querySelector("#bd-senderr"), doneEl = root.querySelector("#bd-done");
  var STAR = '<svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3 6.1 20.6l1.3-6.6L2.5 9.4l6.6-.8z"/></svg>';
  var cur = 0, chapters = [], reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function el(t, c, x) { var e = document.createElement(t); if (c) { e.className = c; } if (x != null) { e.textContent = x; } return e; }

  function field(f) {
    var w = el("div", "bd-field"), id = "bd-" + f.n;
    w.setAttribute("data-n", f.n);
    if (f.r) { w.setAttribute("data-r", "1"); w.setAttribute("data-m", f.m || "Заполните это поле"); }
    if (f.t === "consent") {
      w.innerHTML = '<label class="bd-consent"><input type="checkbox" name="consent" value="yes"><span>Я родитель или законный представитель именинника. Согласен(на) на обработку данных для подготовки комплекта. <a href="#" target="_blank" rel="noopener">Политика конфиденциальности</a></span></label>';
      w.querySelector("a").href = CONFIG.privacyUrl;
    } else {
      var lab = el(f.t === "chips" ? "span" : "label", "bd-label", f.l);
      if (f.t !== "chips") { lab.setAttribute("for", id); }
      if (!f.r) { lab.appendChild(el("span", "bd-opt", " (по желанию)")); }
      w.appendChild(lab);
      if (f.h) { w.appendChild(el("span", "bd-hint", f.h)); }
      var c;
      if (f.t === "textarea") { c = el("textarea"); c.rows = 3; }
      else if (f.t === "select") {
        c = el("select"); c.appendChild(el("option", "", "Выберите")).value = "";
        f.o.forEach(function (o) { c.appendChild(el("option", "", o)); });
      } else if (f.t === "chips") {
        c = el("div", "bd-chips"); c.setAttribute("role", "group");
        f.o.forEach(function (o) {
          var l = el("label"), i = el("input"), s = el("span", "", o);
          i.type = "checkbox"; i.name = f.n; i.value = o; l.appendChild(i); l.appendChild(s); c.appendChild(l);
        });
      } else { c = el("input"); c.type = f.t; c.autocomplete = "off"; if (f.p) { c.placeholder = f.p; } }
      if (f.t !== "chips") { c.id = id; c.name = f.n; }
      w.appendChild(c);
    }
    w.appendChild(el("span", "bd-err")).setAttribute("role", "alert");
    return w;
  }

  CH.forEach(function (c, i) {
    var s = el("div", "bd-ch"); s.hidden = i > 0;
    var h = el("h3", "", c.t); h.tabIndex = -1; s.appendChild(h);
    s.appendChild(el("p", "bd-lead", c.lead));
    c.f.forEach(function (f) { s.appendChild(field(f)); });
    holder.appendChild(s); chapters.push(s);
    var li = el("li", "bd-star"); li.innerHTML = STAR; starsEl.appendChild(li);
  });

  function show(n, focus) {
    cur = n;
    chapters.forEach(function (c, i) { c.hidden = i !== n; });
    [].slice.call(starsEl.children).forEach(function (s, i) { s.className = "bd-star" + (i < n ? " done" : "") + (i === n ? " now" : ""); });
    stepEl.textContent = "Глава " + (n + 1) + " из " + CH.length;
    back.style.visibility = n === 0 ? "hidden" : "visible";
    nextB.hidden = n === CH.length - 1; send.hidden = n !== CH.length - 1;
    senderr.textContent = "";
    root.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "start" });
    if (focus) { chapters[n].querySelector("h3").focus({ preventScroll: true }); }
  }

  function val(n) {
    var e = form.elements[n];
    if (!e) { return ""; }
    if (e.length && e[0] && e[0].type === "checkbox") {
      return [].slice.call(form.querySelectorAll('input[name="' + n + '"]:checked')).map(function (x) { return x.value; }).join(", ");
    }
    if (e.type === "checkbox") { return e.checked ? "да" : ""; }
    return (e.value || "").trim();
  }

  function chapterOk(i) {
    var bad = null;
    [].slice.call(chapters[i].querySelectorAll("[data-r]")).forEach(function (w) {
      var ok = !!val(w.getAttribute("data-n"));
      w.querySelector(".bd-err").textContent = ok ? "" : w.getAttribute("data-m");
      var c = w.querySelector("input,select,textarea"); if (c) { c.setAttribute("aria-invalid", ok ? "false" : "true"); }
      if (!ok && !bad) { bad = c; }
    });
    if (bad) { bad.focus(); }
    return !bad;
  }

  form.addEventListener("input", function (e) {
    var w = e.target.closest("[data-r]");
    if (w && w.querySelector(".bd-err").textContent && val(w.getAttribute("data-n"))) { w.querySelector(".bd-err").textContent = ""; e.target.setAttribute("aria-invalid", "false"); }
  });
  form.addEventListener("change", function (e) {
    var w = e.target.closest("[data-r]");
    if (w && val(w.getAttribute("data-n"))) { w.querySelector(".bd-err").textContent = ""; }
  });
  form.addEventListener("keydown", function (e) { if (e.key === "Enter" && e.target.tagName === "INPUT" && e.target.type !== "checkbox") { e.preventDefault(); } });
  nextB.addEventListener("click", function () { if (chapterOk(cur)) { show(cur + 1, true); } });
  back.addEventListener("click", function () { show(cur - 1, true); });

  function collect() {
    var a = {}, L = ["Анкета «День рождения под ключ»"];
    CH.forEach(function (c, i) {
      L.push("", "— Глава " + (i + 1) + ". " + c.t + " —");
      c.f.forEach(function (f) {
        if (f.t === "consent") { return; }
        var v = val(f.n); a[f.n] = v;
        if (v) { L.push(f.l + ": " + v); }
      });
    });
    return { answers: a, summary: L.join("\n") };
  }

  function finish(r, mode) {
    form.hidden = true; doneEl.hidden = false;
    [].slice.call(starsEl.children).forEach(function (s) { s.className = "bd-star done"; });
    stepEl.textContent = "Анкета заполнена";
    if (mode === "sent") {
      doneEl.innerHTML = '<h3 tabindex="-1">Спасибо, анкета отправлена!</h3><p class="bd-lead">Мы свяжемся с вами по контакту, который вы указали.</p>';
    } else {
      var who = r.answers.child_name || "именинника";
      doneEl.innerHTML = '<h3 tabindex="-1"></h3><p class="bd-lead"></p>' +
        '<div class="bd-actions"><button type="button" class="bd-btn" id="bd-copy">Скопировать анкету</button></div>' +
        '<p class="bd-ok" id="bd-copied" aria-live="polite"></p>' +
        '<label class="bd-label" for="bd-sum">Текст анкеты</label><textarea id="bd-sum" readonly></textarea>';
      doneEl.querySelector("h3").textContent = mode === "failed" ? "Отправим вручную" : "Анкета готова";
      doneEl.querySelector(".bd-lead").textContent = mode === "failed"
        ? "Не получилось отправить автоматически. Скопируйте текст и отправьте нам."
        : "Осталось отправить анкету нам: скопируйте текст и отправьте сообщением.";
      var ta = doneEl.querySelector("#bd-sum"); ta.value = r.summary;
      var acts = doneEl.querySelector(".bd-actions");
      function link(label, href) { var a = el("a", "bd-btn ghost", label); a.href = href; if (/^https?:/.test(href)) { a.target = "_blank"; a.rel = "noopener"; } acts.appendChild(a); }
      if (CONFIG.max) { link("Открыть Max", CONFIG.max); }
      if (CONFIG.email) { link("Написать на почту", "mailto:" + CONFIG.email + "?subject=" + encodeURIComponent("Анкета: день рождения, " + who) + "&body=" + encodeURIComponent("Здравствуйте! Заполнил(а) анкету, полный текст ниже:\n\n")); }
      if (CONFIG.telegram) { link("Telegram", "https://t.me/" + CONFIG.telegram); }
      doneEl.querySelector("#bd-copy").addEventListener("click", function () {
        var ok = function () { doneEl.querySelector("#bd-copied").textContent = "Скопировано. Теперь вставьте текст в сообщение."; };
        if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(r.summary).then(ok, function () { ta.select(); document.execCommand("copy"); ok(); }); }
        else { ta.select(); document.execCommand("copy"); ok(); }
      });
    }
    root.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "start" });
    doneEl.querySelector("h3").focus({ preventScroll: true });
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    for (var i = 0; i < chapters.length; i++) { if (!chapterOk(i)) { show(i, false); chapterOk(i); return; } }
    var r = collect();
    if (!CONFIG.submitUrl) { finish(r, "manual"); return; }
    var fd = new FormData(); fd.append("summary", r.summary); fd.append("answers", JSON.stringify(r.answers));
    send.disabled = true; send.textContent = "Отправляем…";
    fetch(CONFIG.submitUrl, { method: "POST", body: fd })
      .then(function (x) { if (!x.ok) { throw new Error(x.status); } finish(r, "sent"); })
      .catch(function () { finish(r, "failed"); });
  });

  show(0, false);
})();
</script>
</section>
